<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BMAX Quad Menu — Visual Editor</title><style>
:root{color-scheme:dark;font:14px/1.45 system-ui,'Microsoft JhengHei',sans-serif;background:#17191e;color:#e8ebf0}*{box-sizing:border-box}body{margin:0}header{padding:16px 22px;background:#222630;display:flex;gap:15px;align-items:center;flex-wrap:wrap;position:sticky;top:0;z-index:20;border-bottom:1px solid #424854}h1{font-size:18px;margin:0 12px 0 0}.tag{font-size:12px;color:#a3b2c7}button,input,select,textarea{font:inherit;border:1px solid #515968;border-radius:5px;background:#303642;color:#f4f6fa;padding:6px 9px}button{cursor:pointer}button:hover{background:#455269}button.primary{background:#3668a7;border-color:#5387c7}input[type=file]{max-width:290px}#layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;margin:18px 24px}.toolbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.quadgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.quad{min-height:235px;background:#232830;border:1px solid #4a505d;border-radius:8px;padding:10px}.quad h3{font-size:14px;margin:0 0 8px;color:#a9c5ed;display:flex;justify-content:space-between}.items{border:1px dashed #465063;border-radius:5px;min-height:42px;padding:5px;background:#1b2029}.items.over,.entry.over{outline:2px solid #7cbbfd;background:#34485e}.entry{border:1px solid #434b58;background:#303640;margin:4px 0;border-radius:4px;padding:6px;cursor:grab}.entry.selected{border-color:#91baff;background:#3b4d69}.entry .heading{display:flex;gap:8px;align-items:center}.entry .heading span.name{flex:1;overflow-wrap:anywhere}.entry .heading code{font-size:11px;color:#a7b2c3}.entry .nested{padding:4px 4px 0 13px;margin:5px 0 0;border-left:2px solid #52637b}.addrow{margin-top:6px;display:flex;gap:5px}aside{background:#222831;border:1px solid #454f5c;border-radius:8px;padding:15px;align-self:start;position:sticky;top:106px}aside label{display:block;margin:10px 0 4px;color:#b4c4d8}aside input,aside textarea,aside select{width:100%}textarea{min-height:80px}#notice{padding:12px 24px;color:#b2c5dc;font-size:13px}.foot{padding:10px 24px;color:#a5afbc}small{color:#93a8c0}.pill{font-size:11px;border:1px solid #59708b;border-radius:4px;padding:2px 5px}#empty{color:#7c8da5;padding:6px}@media(max-width:850px){#layout{grid-template-columns:1fr}.quadgrid{grid-template-columns:1fr}aside{position:static}}
</style></head><body>
<header><h1>BMAX Quad Menu</h1><span class="tag">v0.0.12 · Drag Editor</span><div class="toolbar"><input id="file" type="file" accept=".json,application/json"><button id="download" class="primary">匯出修改後的 JSON</button><button id="newempty">建立空白配置</button></div></header>
<div id="notice">先點「選擇檔案」載入 Blender 既有的 menus.json（可在 Add-ons 主控台找到儲存位置）。拖曳指令到四象限、其他指令前面，或子選單內。編輯完成請匯出 JSON，再回 Blender 點 Import。</div>
<div class="toolbar" style="padding:0 24px 7px"><label>頁面 <select id="page"></select></label><button id="addpage">新增頁面</button><button id="deletepage">刪除頁面</button><label>Blender 模式 <select id="mode"></select></label><span id="summary" class="tag"></span></div>
<div id="layout"><main><div id="quads" class="quadgrid"></div></main><aside><h3>項目設定</h3><div id="properties"><small>點選一個指令或子選單以編輯屬性。</small></div></aside></div>
<div class="foot">提示：按住指令左側的「⠿」拖曳；放進子選單的虛線區域即成為下一層。模式與頁面會分開儲存。此頁在本機開啟，不需要網路。</div>
<script>
'use strict';
const MODES=['GLOBAL','ANIMATION','OBJECT','EDIT_MESH','EDIT_CURVE','EDIT_SURFACE','EDIT_ARMATURE','EDIT_LATTICE','EDIT_TEXT','SCULPT','PAINT_VERTEX','PAINT_WEIGHT','PAINT_TEXTURE','POSE','PARTICLE','OTHER'];
const Q=['Q1','Q2','Q3','Q4']; const desc=['Q1｜選取／關鍵影格','Q2｜顯示／導覽','Q3｜編輯／插值','Q4｜變換／播放'];
let db={format:'BMAX Quad Menu',version:1,pages:['Default'],active_page:'Default',items:[],ui:{font_size:12,item_height:23,panel_width:205},shortcut:{key:'Q',ctrl:true,shift:true,alt:false}};
let activePage='Default', activeMode='OBJECT', picked=null, dragged=null;
const el=id=>document.getElementById(id); const uid=()=>('mq'+Date.now().toString(36)+Math.random().toString(36).slice(2,12));
const escapeHTML=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalize(){db.items=(db.items||[]).map(x=>({uid:x.uid||uid(),parent:x.parent||'',mode:x.mode||'OBJECT',quad:x.quad||'Q1',kind:x.kind||'OP',label:x.label||'New Command',operator:x.operator||'',kwargs:typeof x.kwargs==='string'?x.kwargs:JSON.stringify(x.kwargs||{}),invoke:x.invoke!==false,enabled:x.enabled!==false,page:x.page||'Default'}));db.pages=Array.isArray(db.pages)&&db.pages.length?db.pages:['Default'];for(const it of db.items)if(!db.pages.includes(it.page))db.pages.push(it.page);activePage=db.pages.includes(db.active_page)?db.active_page:db.pages[0]}
function render(){el('page').innerHTML=db.pages.map(p=>`<option value="${escapeHTML(p)}">${escapeHTML(p)}</option>`).join('');el('page').value=activePage;el('mode').innerHTML=MODES.map(m=>`<option>${m}</option>`).join('');el('mode').value=activeMode;el('quads').innerHTML='';Q.forEach((q,i)=>{let box=document.createElement('section');box.className='quad';box.innerHTML=`<h3>${q} · ${desc[i]} <span class="pill">${activeMode}</span></h3>`;let list=document.createElement('div');list.className='items';list.append(...makeEntries(q,''));addDrop(list,q,'');box.append(list);let buttons=document.createElement('div');buttons.className='addrow';[['新增指令','OP'],['新增下層','SUB'],['分隔線','SEP']].forEach(([name,kind])=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>addItem(q,'',kind);buttons.append(b)});box.append(buttons);el('quads').append(box)});drawProps();el('summary').textContent='目前頁面有 '+db.items.filter(x=>x.page===activePage&&x.mode===activeMode).length+' 個項目'}
function makeEntries(q,parent){return db.items.filter(x=>x.page===activePage&&x.mode===activeMode&&x.quad===q&&x.parent===parent).map(it=>{let node=document.createElement('div');node.className='entry'+(it.uid===picked?' selected':'');node.draggable=true;node.dataset.id=it.uid;node.innerHTML=`<div class="heading"><span aria-label="拖曳">⠿</span><span class="name">${escapeHTML(it.label)}</span><code>${it.kind==='SUB'?'▶':it.kind==='SEP'?'──':'●'}</code></div>`;node.addEventListener('click',e=>{e.stopPropagation();picked=it.uid;render()});node.addEventListener('dragstart',e=>{dragged=it.uid;e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',it.uid);e.stopPropagation()});node.addEventListener('dragover',e=>{e.preventDefault();e.stopPropagation();node.classList.add('over')});node.addEventListener('dragleave',()=>node.classList.remove('over'));node.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();node.classList.remove('over');moveItem(dragged,it.quad,it.parent,it.uid)});
if(it.kind==='SUB'){let nested=document.createElement('div');nested.className='nested items';nested.append(...makeEntries(q,it.uid));addDrop(nested,q,it.uid);node.append(nested)}return node})}
function addDrop(node,q,parent){node.addEventListener('dragover',e=>{if(e.target!==node)return;e.preventDefault();node.classList.add('over')});node.addEventListener('dragleave',e=>{if(e.target===node)node.classList.remove('over')});node.addEventListener('drop',e=>{e.preventDefault();e.stopPropagation();node.classList.remove('over');moveItem(dragged,q,parent,null)})}
function descendants(id){const seen=new Set([id]);let changed=true;while(changed){changed=false;for(const x of db.items){if(seen.has(x.parent)&&!seen.has(x.uid)){seen.add(x.uid);changed=true}}}return seen}
function moveItem(id,quad,parent,before){let it=db.items.find(x=>x.uid===id);if(!it)return;if(descendants(id).has(parent))return alert('不可把子選單拖到自己的下一層');const family=descendants(id),oldMode=it.mode,oldPage=it.page;let block=db.items.filter(x=>family.has(x.uid));db.items=db.items.filter(x=>!family.has(x.uid));block.forEach(x=>{x.page=activePage;x.mode=activeMode;x.quad=quad});it.parent=parent;let pos=before?db.items.findIndex(x=>x.uid===before):-1;if(pos<0)pos=db.items.length;db.items.splice(pos,0,...block);picked=id;render()}
function addItem(quad,parent,kind){const it={uid:uid(),parent,mode:activeMode,quad,kind,label:kind==='OP'?'New Command':kind==='SUB'?'New Submenu':'────────',operator:'',kwargs:'{}',invoke:true,enabled:true,page:activePage};db.items.push(it);picked=it.uid;render()}
function change(field,value){let it=db.items.find(x=>x.uid===picked);if(!it)return;it[field]=value;render()}
function drawProps(){let p=el('properties'),it=db.items.find(x=>x.uid===picked);if(!it){p.innerHTML='<small>點選一個指令或子選單以編輯屬性。</small>';return}p.innerHTML='';const make=(title,type,value,callback)=>{let label=document.createElement('label');label.textContent=title;let inp=document.createElement(type==='textarea'?'textarea':'input');if(type!=='textarea')inp.type=type;inp.value=value;inp.onchange=()=>callback(inp.value);p.append(label,inp)};make('顯示名稱','text',it.label,v=>change('label',v));let label=document.createElement('label');label.textContent='項目類型';let sel=document.createElement('select');['OP','SUB','SEP'].forEach(kind=>{let o=document.createElement('option');o.value=kind;o.textContent=kind==='OP'?'指令':kind==='SUB'?'下一層子選單':'分隔線';sel.append(o)});sel.value=it.kind;sel.onchange=()=>change('kind',sel.value);p.append(label,sel);if(it.kind==='OP'){make('Operator ID（如 mesh.bevel）','text',it.operator,v=>change('operator',v));make('Properties JSON','textarea',it.kwargs,v=>{try{const data=JSON.parse(v);if(!data||Array.isArray(data)||typeof data!=='object')throw Error();change('kwargs',v)}catch(e){alert('參數必須是 JSON 物件')}})}let inv=document.createElement('label');inv.innerHTML='<input type="checkbox" style="width:auto"> 互動式 Invoke';inv.querySelector('input').checked=it.invoke;inv.querySelector('input').onchange=e=>change('invoke',e.target.checked);p.append(inv);let en=document.createElement('label');en.innerHTML='<input type="checkbox" style="width:auto"> 啟用';en.querySelector('input').checked=it.enabled;en.querySelector('input').onchange=e=>change('enabled',e.target.checked);p.append(en);let del=document.createElement('button');del.textContent='刪除此項與所有下層';del.style.marginTop='14px';del.onclick=()=>{if(!confirm('確定刪除此項與所有子層？'))return;let ids=descendants(it.uid);db.items=db.items.filter(x=>!ids.has(x.uid));picked=null;render()};p.append(del)}
el('page').onchange=e=>{activePage=e.target.value;db.active_page=activePage;picked=null;render()};el('mode').onchange=e=>{activeMode=e.target.value;picked=null;render()};
el('addpage').onclick=()=>{let n=prompt('新頁面名稱');if(!n)return;n=n.trim();if(!n||db.pages.includes(n))return alert('頁面名稱不能重複');db.pages.push(n);db.active_page=activePage=n;picked=null;render()};
el('deletepage').onclick=()=>{if(activePage==='Default')return alert('不能刪除 Default 頁面');if(!confirm('確定刪除此頁及全部指令？'))return;db.items=db.items.filter(x=>x.page!==activePage);db.pages=db.pages.filter(x=>x!==activePage);db.active_page=activePage='Default';picked=null;render()};
el('newempty').onclick=()=>{if(!confirm('以空白配置取代編輯器目前內容？'))return;db={format:'BMAX Quad Menu',version:1,pages:['Default'],active_page:'Default',items:[],ui:{font_size:12,item_height:23,panel_width:205},shortcut:{key:'Q',ctrl:true,shift:true,alt:false}};normalize();render()};
el('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.items))throw Error('缺少 items 陣列');db=x;normalize();picked=null;render();el('notice').textContent='已載入：'+f.name+'。編輯後請「匯出修改後的 JSON」，再回 Blender Add-ons 點 Import Edited JSON。'}catch(err){alert('載入失敗：'+err.message)}};
el('download').onclick=()=>{for(let x of db.items.filter(x=>x.kind==='OP')){try{let d=JSON.parse(x.kwargs||'{}');if(!d||typeof d!=='object'||Array.isArray(d))throw Error()}catch{alert('參數 JSON 無效：'+x.label);return}}db.active_page=activePage;let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json;charset=utf-8'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='max_quad_menus_edited.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
if(window.__MAXQUAD_PAYLOAD){db=window.__MAXQUAD_PAYLOAD;normalize();el('notice').textContent='已自動載入 Blender 目前的選單設定。拖曳完成後匯出 JSON，回 Add-ons 主控台使用 Import Edited JSON。';}else{normalize();}render();
</script></body></html>
